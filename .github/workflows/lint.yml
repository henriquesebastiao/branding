name: Lint

on:
  pull_request:
  push:

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
      - name: Install dependencies
        run: yarn
      - name: Check formatting with Prettier
        run: yarn prettier . --check
